<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-grad-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1228"/>
      <stop offset="1" stop-color="#0B0810"/>
    </linearGradient>
    <linearGradient id="album-grad-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8B96"/>
      <stop offset="0.5" stop-color="#E94E9D"/>
      <stop offset="1" stop-color="#A346C2"/>
    </linearGradient>
    <linearGradient id="share-grad-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8B96"/>
      <stop offset="0.5" stop-color="#E94E9D"/>
      <stop offset="1" stop-color="#A346C2"/>
    </linearGradient>
    <filter id="glow-1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- bg -->
  <rect width="320" height="200" fill="url(#bg-grad-1)"/>

  <!-- browser chrome -->
  <rect width="320" height="18" fill="#15101F"/>
  <circle cx="8" cy="9" r="2.5" fill="#FF5F57"/>
  <circle cx="16" cy="9" r="2.5" fill="#FEBC2E"/>
  <circle cx="24" cy="9" r="2.5" fill="#28C840"/>
  <rect x="36" y="4" width="240" height="10" rx="5" fill="#2D2240" opacity="0.7"/>
  <text x="44" y="11.5" font-family="JetBrains Mono, monospace" font-size="6" fill="#B2A8C8">spotify.com / track / quase-manha</text>

  <!-- left: album cover -->
  <rect x="20" y="40" width="92" height="92" rx="6" fill="url(#album-grad-1)"/>
  <text x="66" y="80" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" opacity="0.92">QUASE</text>
  <text x="66" y="95" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" opacity="0.92">MANHÃ</text>

  <!-- right: song info -->
  <text x="124" y="55" font-family="JetBrains Mono, monospace" font-size="6" letter-spacing="0.6" fill="#B2A8C8">TOCANDO AGORA</text>
  <text x="124" y="78" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="18" fill="#F5F1FA">Quase manhã</text>
  <text x="124" y="92" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="9" fill="#B2A8C8">Júlia Bandeira · Antes do céu clarear</text>

  <!-- progress bar -->
  <rect x="124" y="106" width="170" height="2" rx="1" fill="#2D2240"/>
  <rect x="124" y="106" width="60" height="2" rx="1" fill="#E94E9D"/>
  <circle cx="184" cy="107" r="2.5" fill="#FFFFFF"/>
  <text x="124" y="118" font-family="JetBrains Mono, monospace" font-size="6" fill="#7C7194">1:24</text>
  <text x="294" y="118" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="6" fill="#7C7194">3:45</text>

  <!-- bottom controls -->
  <g transform="translate(124, 136)" fill="none" stroke="#B2A8C8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- heart -->
    <path d="M4 6 C 4 3, 7 3, 8 5 C 9 3, 12 3, 12 6 C 12 9, 8 12, 8 12 C 8 12, 4 9, 4 6 Z"/>
    <!-- prev -->
    <g transform="translate(26, 0)"><path d="M2 2 L 2 12 M 12 2 L 4 7 L 12 12 Z" fill="#B2A8C8"/></g>
    <!-- play (filled, accented) -->
    <g transform="translate(48, 0)">
      <circle cx="8" cy="7" r="9" fill="#F5F1FA"/>
      <path d="M6 3 L 14 7 L 6 11 Z" fill="#0B0810" stroke="none"/>
    </g>
    <!-- next -->
    <g transform="translate(74, 0)"><path d="M4 2 L 12 7 L 4 12 Z M 14 2 L 14 12" fill="#B2A8C8"/></g>
  </g>

  <!-- share button (highlighted) — main element, fully visible -->
  <g transform="translate(264, 132)" filter="url(#glow-1)">
    <rect x="0" y="0" width="22" height="22" rx="6" fill="url(#share-grad-1)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(5, 5)">
      <path d="M0 7 L 0 11 C 0 12, 1 12, 1 12 L 10 12 C 10 12, 11 12, 11 11 L 11 7"/>
      <polyline points="8 3 5.5 1 3 3"/>
      <line x1="5.5" y1="1" x2="5.5" y2="9"/>
    </g>
  </g>
</svg>
