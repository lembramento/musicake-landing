<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-grad-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1228"/>
      <stop offset="1" stop-color="#0B0810"/>
    </linearGradient>
    <linearGradient id="album-grad-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8B96"/>
      <stop offset="0.5" stop-color="#E94E9D"/>
      <stop offset="1" stop-color="#A346C2"/>
    </linearGradient>
    <linearGradient id="card-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D2240"/>
      <stop offset="1" stop-color="#1A1228"/>
    </linearGradient>
  </defs>

  <!-- bg -->
  <rect width="320" height="200" fill="url(#bg-grad-3)"/>

  <!-- browser chrome -->
  <rect width="320" height="18" fill="#15101F"/>
  <circle cx="8" cy="9" r="2.5" fill="#FF5F57"/>
  <circle cx="16" cy="9" r="2.5" fill="#FEBC2E"/>
  <circle cx="24" cy="9" r="2.5" fill="#28C840"/>
  <rect x="36" y="4" width="240" height="10" rx="5" fill="#2D2240" opacity="0.7"/>
  <text x="44" y="11.5" font-family="JetBrains Mono, monospace" font-size="6" fill="#FF8B96">musicake.app / k7p2-ah</text>

  <!-- subtle radial glow behind card -->
  <ellipse cx="160" cy="115" rx="120" ry="60" fill="#E94E9D" opacity="0.06"/>

  <!-- main card -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="260" height="160" rx="14" fill="url(#card-glow)" stroke="#3A2D52"/>

    <!-- LINK CRIADO badge -->
    <g transform="translate(98, 14)">
      <rect x="0" y="0" width="64" height="14" rx="7" fill="#FF8B96" opacity="0.15" stroke="#FF8B96" stroke-width="0.6"/>
      <circle cx="9" cy="7" r="3.5" fill="#FF8B96"/>
      <path d="M7 7 L 8.5 8.5 L 11 6" stroke="#0B0810" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="9.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" letter-spacing="1.2" fill="#FF8B96">LINK CRIADO</text>
    </g>

    <!-- song card -->
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="220" height="32" rx="8" fill="#1A1228" stroke="#3A2D52" stroke-width="0.6"/>
      <rect x="6" y="6" width="20" height="20" rx="4" fill="url(#album-grad-3)"/>
      <text x="34" y="16" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="9" fill="#F5F1FA">Quase manhã</text>
      <text x="34" y="25" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="7" fill="#B2A8C8">Júlia Bandeira</text>
    </g>

    <!-- URL display -->
    <g transform="translate(20, 78)">
      <rect x="0" y="0" width="220" height="22" rx="11" fill="#0B0810" stroke="#3A2D52" stroke-width="0.6"/>
      <text x="14" y="14.5" font-family="JetBrains Mono, monospace" font-size="8" fill="#F5F1FA">musicake.app/<tspan font-weight="700" fill="#F5F1FA">k7p20ik5</tspan></text>
      <g transform="translate(174, 4)">
        <rect x="0" y="0" width="42" height="14" rx="7" fill="#E94E9D"/>
        <text x="21" y="9.5" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="6.5" fill="#FFFFFF">copiar</text>
      </g>
    </g>

    <!-- platforms list (4 items in a 2x2 grid for compactness) -->
    <text x="130" y="116" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="5.5" letter-spacing="1.2" fill="#7C7194">PLATAFORMAS QUE ABREM</text>

    <g transform="translate(20, 122)">
      <!-- row 1 -->
      <g>
        <rect x="0" y="0" width="105" height="14" rx="7" fill="#1A1228" stroke="#3A2D52" stroke-width="0.5"/>
        <circle cx="8" cy="7" r="3.5" fill="#1DB954"/>
        <text x="16" y="9.5" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="6.5" fill="#F5F1FA">Spotify</text>
        <g transform="translate(94, 4)" fill="none" stroke="#4ECDB8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 3.5 L 2.5 6 L 7 1.5"/>
        </g>
      </g>
      <g transform="translate(115, 0)">
        <rect x="0" y="0" width="105" height="14" rx="7" fill="#1A1228" stroke="#3A2D52" stroke-width="0.5"/>
        <circle cx="8" cy="7" r="3.5" fill="#FA2D48"/>
        <text x="16" y="9.5" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="6.5" fill="#F5F1FA">Apple Music</text>
        <g transform="translate(94, 4)" fill="none" stroke="#4ECDB8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 3.5 L 2.5 6 L 7 1.5"/>
        </g>
      </g>

      <!-- row 2 -->
      <g transform="translate(0, 18)">
        <rect x="0" y="0" width="105" height="14" rx="7" fill="#1A1228" stroke="#3A2D52" stroke-width="0.5"/>
        <circle cx="8" cy="7" r="3.5" fill="#A238FF"/>
        <text x="16" y="9.5" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="6.5" fill="#F5F1FA">Deezer</text>
        <g transform="translate(94, 4)" fill="none" stroke="#4ECDB8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 3.5 L 2.5 6 L 7 1.5"/>
        </g>
      </g>
      <g transform="translate(115, 18)">
        <rect x="0" y="0" width="105" height="14" rx="7" fill="#1A1228" stroke="#3A2D52" stroke-width="0.5"/>
        <circle cx="8" cy="7" r="3.5" fill="#FF0033"/>
        <text x="16" y="9.5" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="6.5" fill="#F5F1FA">YouTube Music</text>
        <g transform="translate(94, 4)" fill="none" stroke="#4ECDB8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 3.5 L 2.5 6 L 7 1.5"/>
        </g>
      </g>
    </g>
  </g>
</svg>
