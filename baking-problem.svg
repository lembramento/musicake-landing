<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bp-album" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ED760"/>
      <stop offset="0.5" stop-color="#1DB954"/>
      <stop offset="1" stop-color="#14833B"/>
    </linearGradient>
    <linearGradient id="bp-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8B96"/>
      <stop offset="0.5" stop-color="#E94E9D"/>
      <stop offset="1" stop-color="#A346C2"/>
    </linearGradient>
    <filter id="bp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background subtle radial glow -->
  <ellipse cx="160" cy="230" rx="120" ry="80" fill="#E94E9D" opacity="0.08"/>

  <!-- the music — small and buried at the back -->
  <g transform="translate(115, 232)" opacity="0.55">
    <rect x="0" y="0" width="90" height="90" rx="12" fill="url(#bp-album)"/>
    <text x="45" y="42" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" opacity="0.92">MARÉ</text>
    <text x="45" y="56" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" opacity="0.92">VIVA</text>
    <text x="45" y="74" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" letter-spacing="1.1" fill="#FFFFFF" opacity="0.7">VOLMÉRIO COSTA</text>
  </g>
  <!-- subtle X cross over the album, hinting at "blocked" access -->
  <g transform="translate(115, 232)" stroke="#0B0810" stroke-width="2.5" stroke-linecap="round" opacity="0.45">
    <line x1="20" y1="20" x2="70" y2="70"/>
    <line x1="70" y1="20" x2="20" y2="70"/>
  </g>

  <!-- DIALOG 3 (bottom, behind) -->
  <g transform="translate(48, 168) rotate(4)" filter="url(#bp-shadow)">
    <rect x="0" y="0" width="200" height="64" rx="12" fill="#1A1228" stroke="#3A2D52"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="7" letter-spacing="1.2" fill="#7C7194">3 · CONFIRMAR PRÉ-SAVE</text>
    <rect x="14" y="28" width="120" height="6" rx="2" fill="#2D2240"/>
    <rect x="14" y="40" width="80" height="6" rx="2" fill="#2D2240"/>
    <rect x="148" y="32" width="42" height="20" rx="10" fill="#1DB954"/>
    <text x="169" y="45" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="8" fill="#FFFFFF">salvar</text>
  </g>

  <!-- DIALOG 2 (middle) -->
  <g transform="translate(60, 102)" filter="url(#bp-shadow)">
    <rect x="0" y="0" width="208" height="68" rx="14" fill="#221833" stroke="#4D3B68"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="7" letter-spacing="1.2" fill="#B2A8C8">2 · AUTORIZAR APP</text>
    <text x="14" y="38" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="10" fill="#B2A8C8">Permitir acesso à sua biblioteca?</text>
    <rect x="14" y="48" width="64" height="14" rx="7" fill="transparent" stroke="#4D3B68"/>
    <text x="46" y="58" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="8" fill="#B2A8C8">cancelar</text>
    <rect x="86" y="48" width="64" height="14" rx="7" fill="#1DB954"/>
    <text x="118" y="58" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="8" fill="#FFFFFF">permitir</text>
  </g>

  <!-- DIALOG 1 (top, in front) -->
  <g transform="translate(72, 28) rotate(-3)" filter="url(#bp-shadow)">
    <rect x="0" y="0" width="216" height="76" rx="14" fill="#2D2240" stroke="#4D3B68"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="7" letter-spacing="1.2" fill="#F5F1FA">1 · FAZER LOGIN</text>
    <!-- input 1 -->
    <rect x="14" y="30" width="188" height="14" rx="7" fill="#0B0810" stroke="#3A2D52"/>
    <text x="22" y="40" font-family="Plus Jakarta Sans, sans-serif" font-size="8" fill="#7C7194">e-mail</text>
    <!-- input 2 -->
    <rect x="14" y="48" width="188" height="14" rx="7" fill="#0B0810" stroke="#3A2D52"/>
    <text x="22" y="58" font-family="Plus Jakarta Sans, sans-serif" font-size="8" fill="#7C7194">senha</text>
  </g>
</svg>
