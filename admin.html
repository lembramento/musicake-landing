<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Musicake · Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0B0810;
  --bg-1: #130C1E;
  --bg-2: #1A1228;
  --surface: #221833;
  --surface-2: #2D2240;
  --border: #3A2D52;
  --border-strong: #4D3B68;
  --text: #F5F1FA;
  --text-muted: #B2A8C8;
  --text-faint: #7C7194;
  --coral: #FF8B96;
  --pink: #FF5E96;
  --magenta: #E94E9D;
  --purple: #A346C2;
  --grad: linear-gradient(135deg, #FF8B96 0%, #E94E9D 48%, #A346C2 100%);
  --ok: #4ECDB8;
  --err: #FF6B6B;
  --radius: 12px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif; line-height: 1.5; }
body { min-height: 100vh; }
a { color: inherit; }

.wrap { max-width: 980px; margin: 0 auto; padding: 32px 24px 120px; }
header.bar { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--border); background: rgba(11,8,16,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10; }
header.bar h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
header.bar h1 span.grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
header.bar .actions { display: flex; gap: 10px; align-items: center; }
.admin-lang-tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.02); }
.admin-lang-btn { background: none; border: 0; padding: 4px 12px; border-radius: 999px; color: var(--text-faint); font: 500 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: color 160ms ease, background 160ms ease; }
.admin-lang-btn:hover { color: var(--text-muted); }
.admin-lang-btn.active { color: white; background: var(--grad); }

button { font-family: inherit; cursor: pointer; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 14px; border: 1px solid transparent; transition: transform 120ms, box-shadow 180ms, background 180ms, border-color 180ms; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--grad); color: white; box-shadow: 0 6px 18px rgba(233,78,157,0.3), inset 0 1px 0 rgba(255,255,255,0.2); }
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(233,78,157,0.45); }
.btn-ghost { background: rgba(255,255,255,0.02); border-color: var(--border); color: var(--text); }
.btn-ghost:hover:not(:disabled) { border-color: var(--border-strong); background: rgba(255,255,255,0.05); }
.btn-danger { background: rgba(255,107,107,0.1); border-color: rgba(255,107,107,0.3); color: var(--err); }
.btn-danger:hover:not(:disabled) { background: rgba(255,107,107,0.2); }

.card { border: 1px solid var(--border); border-radius: var(--radius); background: linear-gradient(180deg, var(--surface), var(--bg-1)); padding: 22px 22px 24px; margin: 18px 0; }
.card h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.card h2 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--magenta); box-shadow: 0 0 10px rgba(233,78,157,0.8); }
.card p.help { color: var(--text-faint); font-size: 13px; margin: 0 0 16px; }

label.field { display: block; margin: 14px 0; }
label.field > span.lab { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; text-transform: lowercase; }
input[type="text"], input[type="password"], textarea {
  width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 14px; color: var(--text); font-family: inherit; font-size: 15px; line-height: 1.45;
  transition: border-color 160ms, box-shadow 160ms;
}
input:focus, textarea:focus { outline: none; border-color: rgba(233,78,157,0.5); box-shadow: 0 0 0 4px rgba(233,78,157,0.1); }
textarea { resize: vertical; min-height: 72px; font-family: inherit; }

.row { display: flex; gap: 12px; align-items: flex-start; }
.row > * { flex: 1; }

.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.toggle input { display: none; }
.toggle .track { width: 38px; height: 22px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--border); position: relative; transition: background 180ms, border-color 180ms; }
.toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-muted); transition: transform 180ms, background 180ms; }
.toggle input:checked + .track { background: var(--grad); border-color: transparent; }
.toggle input:checked + .track::after { transform: translateX(16px); background: white; }
.toggle .label { font-size: 14px; color: var(--text); }

.list-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.18); }
.list-item .item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
.list-item .item-head .idx { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }
.list-item .item-head .ops { display: flex; gap: 6px; }
.list-item .item-head .ops button { padding: 4px 10px; font-size: 12px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-muted); }
.list-item .item-head .ops button:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); }

.array-strings .str-row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.array-strings .str-row input { flex: 1; }
.array-strings .str-row button { padding: 6px 10px; font-size: 12px; border-radius: 6px; background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.25); color: var(--err); }

.add-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-muted); margin-top: 8px; }
.add-btn:hover { color: var(--text); border-color: var(--border-strong); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 100; box-shadow: 0 8px 28px rgba(0,0,0,0.5); border: 1px solid var(--border); }
.toast.ok { background: rgba(78,205,184,0.15); border-color: rgba(78,205,184,0.4); color: var(--ok); }
.toast.err { background: rgba(255,107,107,0.15); border-color: rgba(255,107,107,0.4); color: var(--err); }
.toast.info { background: var(--surface); color: var(--text-muted); }

.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-box { width: 100%; max-width: 380px; padding: 28px; border: 1px solid var(--border); border-radius: var(--radius); background: linear-gradient(180deg, var(--surface), var(--bg-1)); text-align: center; }
.login-box h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.login-box h1 span.grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.login-box p.help { color: var(--text-muted); font-size: 14px; margin: 0 0 22px; }
.login-box input { margin-bottom: 14px; }
.login-box button.btn-primary { width: 100%; padding: 12px; }
.login-box .err { color: var(--err); font-size: 13px; min-height: 20px; margin-top: 8px; }

.logo-row { display: flex; align-items: center; gap: 16px; }
.logo-preview { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; }
.logo-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
.file-input-wrap { flex: 1; }
.file-input-wrap input[type="file"] { display: none; }
.file-input-wrap label.fakebtn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; }
.file-input-wrap label.fakebtn:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.07); }
.file-input-wrap p.fname { color: var(--text-faint); font-size: 12px; margin: 6px 0 0; font-family: 'JetBrains Mono', monospace; }

.preview-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 13px; text-decoration: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); }
.preview-link:hover { color: var(--text); border-color: var(--border-strong); }

.kicker-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; }

.img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.img-slot { display: flex; gap: 14px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: rgba(0,0,0,0.18); align-items: center; }
.img-slot-thumb { width: 72px; height: 72px; flex-shrink: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px; }
.img-slot-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
.img-slot-empty { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-faint); text-align: center; padding: 0 4px; line-height: 1.3; }
.img-slot-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.img-slot-label { font-size: 14px; font-weight: 600; color: var(--text); }
.img-slot-fname { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); word-break: break-all; }
.img-slot-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.img-slot-actions .fakebtn { display: inline-flex; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text); font-size: 12px; font-weight: 500; cursor: pointer; }
.img-slot-actions .fakebtn:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.07); }
.img-slot-clear { padding: 6px 12px; font-size: 12px; border-radius: 999px; background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.25); color: var(--err); }
.img-slot-clear:hover { background: rgba(255,107,107,0.15); }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useCallback, useRef } = React;

const PASSWORD_KEY = "musicake_admin_pwd";
const DRAFT_KEY = "musicake_admin_draft";

function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const result = r.result;
      const comma = result.indexOf(",");
      resolve(result.slice(comma + 1));
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ── Login ─────────────────────────────────────────────────────────────────────
function Login({ onAuth }) {
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    if (!pwd) return;
    setBusy(true);
    setErr("");
    try {
      // Test the password by trying a no-op save (empty files array → 400, but auth checked first)
      const res = await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pwd, files: [] }),
      });
      if (res.status === 401) {
        setErr("Senha incorreta.");
        setBusy(false);
        return;
      }
      // 400 (missing files) or 200 both mean password is OK
      localStorage.setItem(PASSWORD_KEY, pwd);
      onAuth(pwd);
    } catch (e) {
      setErr("Erro de conexão: " + e.message);
      setBusy(false);
    }
  }

  return (
    <div className="login-wrap">
      <form className="login-box" onSubmit={submit}>
        <h1>Painel <span className="grad">Musicake</span></h1>
        <p className="help">Entre com a senha de admin pra editar o site.</p>
        <input type="password" placeholder="senha" value={pwd} onChange={e => setPwd(e.target.value)} autoFocus />
        <button className="btn-primary" type="submit" disabled={busy || !pwd}>{busy ? "verificando…" : "entrar"}</button>
        <div className="err">{err}</div>
      </form>
    </div>
  );
}

// ── Generic field helpers ─────────────────────────────────────────────────────
function TextField({ label, value, onChange, type = "text" }) {
  return (
    <label className="field">
      <span className="lab">{label}</span>
      {type === "textarea"
        ? <textarea value={value || ""} onChange={e => onChange(e.target.value)} rows={3} />
        : <input type="text" value={value || ""} onChange={e => onChange(e.target.value)} />}
    </label>
  );
}

function ArrayOfStrings({ label, value, onChange, placeholder }) {
  const arr = Array.isArray(value) ? value : [];
  function update(i, v) {
    const next = arr.slice();
    next[i] = v;
    onChange(next);
  }
  function add() { onChange([...arr, ""]); }
  function remove(i) { onChange(arr.filter((_, j) => j !== i)); }
  return (
    <div className="field array-strings">
      <span className="lab">{label}</span>
      {arr.map((s, i) => (
        <div className="str-row" key={i}>
          <input type="text" value={s} placeholder={placeholder} onChange={e => update(i, e.target.value)} />
          <button type="button" onClick={() => remove(i)}>remover</button>
        </div>
      ))}
      <button type="button" className="add-btn" onClick={add}>+ adicionar</button>
    </div>
  );
}

function ArrayOfObjects({ label, value, onChange, schema, renderLabel }) {
  // schema is an object of { key: { label, type: "text"|"textarea"|"number" } }
  const arr = Array.isArray(value) ? value : [];
  function update(i, key, v) {
    const next = arr.slice();
    next[i] = { ...next[i], [key]: v };
    onChange(next);
  }
  function add() {
    const blank = {};
    Object.entries(schema).forEach(([k, s]) => { blank[k] = s.type === "number" ? 0 : ""; });
    onChange([...arr, blank]);
  }
  function remove(i) { onChange(arr.filter((_, j) => j !== i)); }
  function move(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= arr.length) return;
    const next = arr.slice();
    [next[i], next[j]] = [next[j], next[i]];
    onChange(next);
  }
  return (
    <div className="field">
      <span className="lab">{label}</span>
      {arr.map((item, i) => (
        <div className="list-item" key={i}>
          <div className="item-head">
            <span className="idx">{renderLabel ? renderLabel(item, i) : `Item ${i + 1}`}</span>
            <div className="ops">
              <button type="button" onClick={() => move(i, -1)} disabled={i === 0}>↑</button>
              <button type="button" onClick={() => move(i, 1)} disabled={i === arr.length - 1}>↓</button>
              <button type="button" onClick={() => remove(i)}>remover</button>
            </div>
          </div>
          {Object.entries(schema).map(([k, s]) => (
            s.type === "textarea"
              ? <TextField key={k} label={s.label} value={item[k]} onChange={v => update(i, k, v)} type="textarea" />
              : s.type === "number"
                ? <TextField key={k} label={s.label} value={item[k]} onChange={v => update(i, k, parseInt(v, 10) || 0)} />
                : <TextField key={k} label={s.label} value={item[k]} onChange={v => update(i, k, v)} />
          ))}
        </div>
      ))}
      <button type="button" className="add-btn" onClick={add}>+ adicionar</button>
    </div>
  );
}

function Toggle({ label, checked, onChange }) {
  return (
    <label className="toggle">
      <input type="checkbox" checked={!!checked} onChange={e => onChange(e.target.checked)} />
      <span className="track"></span>
      <span className="label">{label}</span>
    </label>
  );
}

const SLICE_SLOTS = [
  { path: "slice-step1.png", label: "Slice mobile — passo 1", accept: "image/png" },
  { path: "slice-step2.png", label: "Slice mobile — passo 2", accept: "image/png" },
  { path: "slice-step3.png", label: "Slice mobile — passo 3", accept: "image/png" },
  { path: "slice-desktop-step1.svg", label: "Slice desktop — passo 1", accept: "image/svg+xml" },
  { path: "slice-desktop-step2.svg", label: "Slice desktop — passo 2", accept: "image/svg+xml" },
  { path: "slice-desktop-step3.svg", label: "Slice desktop — passo 3", accept: "image/svg+xml" },
];

function ImageSlot({ label, path, accept, queuedFile, onPick, onClear, currentSrc, emptyHint }) {
  const previewUrl = queuedFile ? URL.createObjectURL(queuedFile) : currentSrc;
  return (
    <div className="img-slot">
      <div className="img-slot-thumb">
        {previewUrl
          ? <img src={previewUrl} alt={label} />
          : <span className="img-slot-empty">{emptyHint || "vazio"}</span>}
      </div>
      <div className="img-slot-body">
        <div className="img-slot-label">{label}</div>
        <div className="img-slot-fname">{queuedFile ? `novo: ${queuedFile.name}` : `arquivo: ${path}`}</div>
        <div className="img-slot-actions">
          <label className="fakebtn" htmlFor={`up-${path}`}>{queuedFile ? "trocar" : "enviar"}</label>
          <input id={`up-${path}`} type="file" accept={accept} onChange={onPick} style={{ display: "none" }} />
          {(queuedFile || onClear) && <button type="button" className="img-slot-clear" onClick={onClear}>{queuedFile ? "cancelar" : "remover"}</button>}
        </div>
      </div>
    </div>
  );
}

// ── Editor ────────────────────────────────────────────────────────────────────
function Editor({ password, onLogout }) {
  const [content, setContent] = useState(null);
  const [originalContent, setOriginalContent] = useState(null);
  const [busy, setBusy] = useState(false);
  const [toast, setToast] = useState(null);
  const [logoFile, setLogoFile] = useState(null);
  const [logoPreviewUrl, setLogoPreviewUrl] = useState(null);
  const [sliceFiles, setSliceFiles] = useState({});
  const [bakingFile, setBakingFile] = useState(null);
  const [bakingClear, setBakingClear] = useState(false);
  const [editLang, setEditLang] = useState("pt");
  const toastTimer = useRef();

  useEffect(() => {
    (async () => {
      try {
        const draft = localStorage.getItem(DRAFT_KEY);
        const res = await fetch("/content.json?t=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        setOriginalContent(JSON.parse(JSON.stringify(data)));
        if (draft) {
          try {
            const parsed = JSON.parse(draft);
            setContent(parsed);
            showToast("Rascunho local restaurado.", "info");
          } catch { setContent(data); }
        } else {
          setContent(data);
        }
      } catch (e) {
        showToast("Erro ao carregar conteúdo: " + e.message, "err");
      }
    })();
  }, []);

  function showToast(msg, kind = "info", ms = 4000) {
    setToast({ msg, kind });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), ms);
  }

  function update(path, value) {
    setContent(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const keys = path.split(".");
      let obj = next;
      for (let i = 0; i < keys.length - 1; i++) {
        if (!(keys[i] in obj)) obj[keys[i]] = {};
        obj = obj[keys[i]];
      }
      obj[keys[keys.length - 1]] = value;
      localStorage.setItem(DRAFT_KEY, JSON.stringify(next));
      return next;
    });
  }
  // Language-bound update: prefixes the path with the current editLang
  function updL(path, value) { update(`${editLang}.${path}`, value); }

  function onLogoPick(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (!/\.(png|svg|jpg|jpeg|webp)$/i.test(f.name)) {
      showToast("Use PNG, JPG, SVG ou WEBP.", "err");
      return;
    }
    setLogoFile(f);
    const url = URL.createObjectURL(f);
    setLogoPreviewUrl(url);
  }

  function onSlicePick(slot, e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const okExt = slot.path.endsWith(".svg") ? /\.svg$/i : /\.(png|jpg|jpeg|webp)$/i;
    if (!okExt.test(f.name)) {
      showToast(`Use ${slot.path.endsWith(".svg") ? "SVG" : "PNG/JPG/WEBP"} pra ${slot.label}.`, "err");
      e.target.value = "";
      return;
    }
    setSliceFiles(prev => ({ ...prev, [slot.path]: f }));
    e.target.value = "";
  }

  function onBakingPick(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (!/\.(png|svg|jpg|jpeg|webp)$/i.test(f.name)) {
      showToast("Use PNG, JPG, SVG ou WEBP.", "err");
      return;
    }
    setBakingFile(f);
    setBakingClear(false);
    e.target.value = "";
  }

  async function save() {
    if (!content) return;
    setBusy(true);
    try {
      const files = [];
      let newContent = JSON.parse(JSON.stringify(content));
      if (!newContent._meta) newContent._meta = {};

      if (logoFile) {
        const safeName = logoFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const b64 = await fileToBase64(logoFile);
        files.push({ path: safeName, contentBase64: b64 });
        newContent._meta.logo = safeName;
      }

      for (const slot of SLICE_SLOTS) {
        const file = sliceFiles[slot.path];
        if (file) {
          const b64 = await fileToBase64(file);
          files.push({ path: slot.path, contentBase64: b64 });
        }
      }

      if (bakingFile) {
        const ext = (bakingFile.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "");
        const fname = `baking-plate.${ext || "png"}`;
        const b64 = await fileToBase64(bakingFile);
        files.push({ path: fname, contentBase64: b64 });
        newContent._meta.bakingImage = fname;
      } else if (bakingClear) {
        delete newContent._meta.bakingImage;
      }

      const contentJsonStr = JSON.stringify(newContent, null, 2) + "\n";
      files.push({ path: "content.json", contentBase64: utf8ToBase64(contentJsonStr) });

      const res = await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          password,
          message: "admin: update site content",
          files,
        }),
      });
      const body = await res.json();
      if (!res.ok) {
        showToast("Erro ao salvar: " + (body.error || res.status), "err", 8000);
        setBusy(false);
        return;
      }
      setContent(newContent);
      setOriginalContent(JSON.parse(JSON.stringify(newContent)));
      setLogoFile(null);
      setLogoPreviewUrl(null);
      setSliceFiles({});
      setBakingFile(null);
      setBakingClear(false);
      localStorage.removeItem(DRAFT_KEY);
      showToast("Salvo! Aguarde ~30s para o site atualizar.", "ok", 6000);
    } catch (e) {
      showToast("Erro: " + e.message, "err", 8000);
    }
    setBusy(false);
  }

  function discardDraft() {
    if (!confirm("Descartar todas as edições não salvas?")) return;
    localStorage.removeItem(DRAFT_KEY);
    setContent(JSON.parse(JSON.stringify(originalContent)));
    setLogoFile(null);
    setLogoPreviewUrl(null);
    setSliceFiles({});
    setBakingFile(null);
    setBakingClear(false);
    showToast("Rascunho descartado.", "info");
  }

  if (!content) return <div style={{ padding: 40, color: "var(--text-muted)" }}>carregando…</div>;

  const sections = (content._meta && content._meta.sections) || {};
  const logo = (content._meta && content._meta.logo) || "musicake_wt.png";
  const lc = content[editLang] || {};
  const heroHook = (lc.heroHooks && lc.heroHooks[0]) || {};

  return (
    <>
      <header className="bar">
        <h1>Painel <span className="grad">Musicake</span></h1>
        <div className="actions">
          <div className="admin-lang-tabs" role="group" aria-label="Editing language">
            <button type="button" className={`admin-lang-btn ${editLang === "pt" ? "active" : ""}`} onClick={() => setEditLang("pt")} aria-pressed={editLang === "pt"}>pt</button>
            <button type="button" className={`admin-lang-btn ${editLang === "en" ? "active" : ""}`} onClick={() => setEditLang("en")} aria-pressed={editLang === "en"}>en</button>
          </div>
          <a className="preview-link" href={`/?lang=${editLang}`} target="_blank">ver site ↗</a>
          <button className="btn-ghost" type="button" onClick={discardDraft}>descartar</button>
          <button className="btn-primary" type="button" onClick={save} disabled={busy}>{busy ? "salvando…" : "salvar"}</button>
          <button className="btn-ghost" type="button" onClick={onLogout}>sair</button>
        </div>
      </header>

      <div className="wrap">

        <div className="card">
          <h2><span className="dot"/>Identidade visual</h2>
          <p className="help">Logo que aparece no topo do site.</p>
          <div className="logo-row">
            <div className="logo-preview" style={{ background: "var(--bg)" }}>
              <img src={logoPreviewUrl || logo} alt="logo" />
            </div>
            <div className="file-input-wrap">
              <label className="fakebtn" htmlFor="logo-up">trocar logo</label>
              <input id="logo-up" type="file" accept="image/png,image/svg+xml,image/jpeg,image/webp" onChange={onLogoPick} />
              <p className="fname">{logoFile ? `selecionado: ${logoFile.name}` : `atual: ${logo}`}</p>
            </div>
          </div>
        </div>

        <div className="card">
          <h2><span className="dot"/>Imagens do Slice</h2>
          <p className="help">Mockups que aparecem na seção "Como compartilhar uma música". 3 PNGs pra aba "no celular", 3 SVGs pra aba "no navegador".</p>
          <div className="img-grid">
            {SLICE_SLOTS.map(slot => (
              <ImageSlot
                key={slot.path}
                label={slot.label}
                path={slot.path}
                accept={slot.accept}
                queuedFile={sliceFiles[slot.path]}
                currentSrc={`/${slot.path}?t=${Date.now()}`}
                onPick={e => onSlicePick(slot, e)}
                onClear={sliceFiles[slot.path] ? () => setSliceFiles(prev => { const n = {...prev}; delete n[slot.path]; return n; }) : null}
              />
            ))}
          </div>
        </div>

        <div className="card">
          <h2><span className="dot"/>Imagem do Baking</h2>
          <p className="help">Hoje a seção "Baking" mostra um mockup feito em código (a "Plate" do Volmério Costa). Você pode trocar por uma imagem customizada — basta enviar um arquivo. Pra voltar ao mockup padrão, clique em "remover".</p>
          <ImageSlot
            label="Mockup do Baking"
            path={content._meta?.bakingImage || "baking-plate.png"}
            accept="image/png,image/svg+xml,image/jpeg,image/webp"
            queuedFile={bakingFile}
            currentSrc={!bakingClear && content._meta?.bakingImage ? `/${content._meta.bakingImage}?t=${Date.now()}` : null}
            onPick={onBakingPick}
            emptyHint={bakingClear ? "voltará ao mockup padrão" : "sem imagem (usa mockup CSS)"}
            onClear={
              bakingFile ? () => setBakingFile(null)
              : (content._meta?.bakingImage && !bakingClear) ? () => setBakingClear(true)
              : bakingClear ? () => setBakingClear(false)
              : null
            }
          />
        </div>

        <div className="card">
          <h2><span className="dot"/>Visibilidade das seções</h2>
          <p className="help">Ligue/desligue cada bloco do site. Mudanças aparecem após salvar.</p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 12 }}>
            {[
              ["problem", "Problema (chat WhatsApp)"],
              ["slice", "Slice (compartilhar música)"],
              ["bakingProblem", "Problema do Baking (chat WhatsApp)"],
              ["baking", "Baking (lançamentos)"],
              ["audience", "Audiência"],
              ["manifesto", "Manifesto"],
              ["testimonials", "Depoimentos"],
              ["faq", "FAQ"],
              ["finalCta", "CTA final"],
            ].map(([key, label]) => (
              <Toggle key={key} label={label} checked={sections[key] !== false}
                onChange={v => update(`_meta.sections.${key}`, v)} />
            ))}
          </div>
        </div>

        <div className="card">
          <h2><span className="dot"/>Navegação</h2>
          <TextField label="link 'para ouvintes'" value={lc.nav?.listen} onChange={v => updL("nav.listen", v)} />
          <TextField label="link 'para artistas'" value={lc.nav?.artists} onChange={v => updL("nav.artists", v)} />
          <TextField label="botão lista de espera" value={lc.nav?.waitlist} onChange={v => updL("nav.waitlist", v)} />
        </div>

        <div className="card">
          <h2><span className="dot"/>Hero (topo)</h2>
          <TextField label="tag acima do título (deixe vazio pra esconder)" value={heroHook.kicker}
            onChange={v => updL("heroHooks", [{ ...heroHook, kicker: v }])} />
          <ArrayOfStrings label="título (uma linha por campo)" value={heroHook.title}
            onChange={v => updL("heroHooks", [{ ...heroHook, title: v }])} />
          <TextField label="subtítulo" value={heroHook.sub} type="textarea"
            onChange={v => updL("heroHooks", [{ ...heroHook, sub: v }])} />
          <div className="row">
            <TextField label="texto botão primário" value={lc.ctaPrimary} onChange={v => updL("ctaPrimary", v)} />
            <TextField label="texto botão secundário" value={lc.ctaSecondary} onChange={v => updL("ctaSecondary", v)} />
          </div>
        </div>

        <div className="card">
          <h2><span className="dot"/>Problema (chat WhatsApp)</h2>
          <p className="help">Seção logo após o Hero. Headline em duas partes, body, e o conteúdo das bolhas do chat.</p>
          <TextField label="início do título" value={lc.problem?.titleStart} onChange={v => updL("problem.titleStart", v)} />
          <TextField label="parte com gradiente (final do título)" value={lc.problem?.titleHighlight} onChange={v => updL("problem.titleHighlight", v)} />
          <TextField label="texto de apoio" value={lc.problem?.body} type="textarea" onChange={v => updL("problem.body", v)} />
          <div className="row">
            <TextField label="título da música (bolha)" value={lc.problem?.chat?.songTitle} onChange={v => updL("problem.chat.songTitle", v)} />
            <TextField label="artista" value={lc.problem?.chat?.songArtist} onChange={v => updL("problem.chat.songArtist", v)} />
          </div>
          <TextField label="host do link (ex: open.spotify.com)" value={lc.problem?.chat?.songHost} onChange={v => updL("problem.chat.songHost", v)} />
          <div className="row">
            <TextField label="capa — título" value={lc.problem?.chat?.coverTitle} onChange={v => updL("problem.chat.coverTitle", v)} />
            <TextField label="capa — artista" value={lc.problem?.chat?.coverArtist} onChange={v => updL("problem.chat.coverArtist", v)} />
          </div>
          <div className="row">
            <TextField label="legenda da mensagem (sua)" value={lc.problem?.chat?.shareCaption} onChange={v => updL("problem.chat.shareCaption", v)} />
            <TextField label="horário (sua)" value={lc.problem?.chat?.shareTime} onChange={v => updL("problem.chat.shareTime", v)} />
          </div>
          <div className="row">
            <TextField label="resposta (do outro)" value={lc.problem?.chat?.reply} onChange={v => updL("problem.chat.reply", v)} />
            <TextField label="horário (resposta)" value={lc.problem?.chat?.replyTime} onChange={v => updL("problem.chat.replyTime", v)} />
          </div>
        </div>

        <div className="card">
          <h2><span className="dot"/>Slice (compartilhar)</h2>
          <div className="row">
            <TextField label="nome" value={lc.slice?.name} onChange={v => updL("slice.name", v)} />
            <TextField label="tag" value={lc.slice?.tag} onChange={v => updL("slice.tag", v)} />
          </div>
          <TextField label="headline" value={lc.slice?.headline} onChange={v => updL("slice.headline", v)} />
          <ArrayOfStrings label="bullets" value={lc.slice?.bullets} onChange={v => updL("slice.bullets", v)} />
          <TextField label="kicker dos passos" value={lc.howSliceKicker} onChange={v => updL("howSliceKicker", v)} />
          <TextField label="título dos passos" value={lc.howSliceTitle} onChange={v => updL("howSliceTitle", v)} />
          <ArrayOfObjects label="passos (celular)" value={lc.howSlice}
            schema={{ n: { label: "número", type: "number" }, label: { label: "texto", type: "textarea" } }}
            renderLabel={(item, i) => `passo ${item.n || i + 1}`}
            onChange={v => updL("howSlice", v)} />
          <ArrayOfObjects label="passos (navegador)" value={lc.howSliceDesktop}
            schema={{ n: { label: "número", type: "number" }, label: { label: "texto", type: "textarea" } }}
            renderLabel={(item, i) => `passo ${item.n || i + 1}`}
            onChange={v => updL("howSliceDesktop", v)} />
          <div className="row">
            <TextField label="rótulo aba mobile" value={lc.howSliceTabs?.mobile} onChange={v => updL("howSliceTabs.mobile", v)} />
            <TextField label="rótulo aba desktop" value={lc.howSliceTabs?.desktop} onChange={v => updL("howSliceTabs.desktop", v)} />
          </div>
        </div>

        <div className="card">
          <h2><span className="dot"/>Problema do Baking (chat WhatsApp)</h2>
          <p className="help">Seção logo antes do Baking, mesma estrutura visual da seção "Problema". Headline em duas partes, body e bolhas do chat.</p>
          <TextField label="início do título" value={lc.bakingProblem?.titleStart} onChange={v => updL("bakingProblem.titleStart", v)} />
          <TextField label="parte com gradiente (final do título) — deixe vazio se não quiser" value={lc.bakingProblem?.titleHighlight} onChange={v => updL("bakingProblem.titleHighlight", v)} />
          <TextField label="texto de apoio" value={lc.bakingProblem?.body} type="textarea" onChange={v => updL("bakingProblem.body", v)} />
          <div className="row">
            <TextField label="título da música (bolha)" value={lc.bakingProblem?.chat?.songTitle} onChange={v => updL("bakingProblem.chat.songTitle", v)} />
            <TextField label="artista" value={lc.bakingProblem?.chat?.songArtist} onChange={v => updL("bakingProblem.chat.songArtist", v)} />
          </div>
          <TextField label="host do link" value={lc.bakingProblem?.chat?.songHost} onChange={v => updL("bakingProblem.chat.songHost", v)} />
          <div className="row">
            <TextField label="capa — título" value={lc.bakingProblem?.chat?.coverTitle} onChange={v => updL("bakingProblem.chat.coverTitle", v)} />
            <TextField label="capa — artista" value={lc.bakingProblem?.chat?.coverArtist} onChange={v => updL("bakingProblem.chat.coverArtist", v)} />
          </div>
          <div className="row">
            <TextField label="legenda da mensagem (sua)" value={lc.bakingProblem?.chat?.shareCaption} onChange={v => updL("bakingProblem.chat.shareCaption", v)} />
            <TextField label="horário (sua)" value={lc.bakingProblem?.chat?.shareTime} onChange={v => updL("bakingProblem.chat.shareTime", v)} />
          </div>
          <div className="row">
            <TextField label="resposta (do outro)" value={lc.bakingProblem?.chat?.reply} onChange={v => updL("bakingProblem.chat.reply", v)} />
            <TextField label="horário (resposta)" value={lc.bakingProblem?.chat?.replyTime} onChange={v => updL("bakingProblem.chat.replyTime", v)} />
          </div>
        </div>

        <div className="card">
          <h2><span className="dot"/>Baking (lançamentos)</h2>
          <div className="row">
            <TextField label="nome" value={lc.baking?.name} onChange={v => updL("baking.name", v)} />
            <TextField label="tag" value={lc.baking?.tag} onChange={v => updL("baking.tag", v)} />
          </div>
          <TextField label="headline" value={lc.baking?.headline} onChange={v => updL("baking.headline", v)} />
          <ArrayOfStrings label="bullets" value={lc.baking?.bullets} onChange={v => updL("baking.bullets", v)} />
          <TextField label="kicker dos passos" value={lc.howBakingKicker} onChange={v => updL("howBakingKicker", v)} />
          <TextField label="título dos passos" value={lc.howBakingTitle} onChange={v => updL("howBakingTitle", v)} />
          <ArrayOfObjects label="passos" value={lc.howBaking}
            schema={{ n: { label: "número", type: "number" }, label: { label: "texto", type: "textarea" } }}
            renderLabel={(item, i) => `passo ${item.n || i + 1}`}
            onChange={v => updL("howBaking", v)} />
        </div>

        <div className="card">
          <h2><span className="dot"/>Audiência</h2>
          <ArrayOfStrings label="título (uma linha por campo)" value={lc.audienceTitle} onChange={v => updL("audienceTitle", v)} />
          <ArrayOfObjects label="grupos" value={lc.audiences}
            schema={{ name: { label: "nome", type: "text" }, desc: { label: "descrição", type: "textarea" } }}
            renderLabel={item => item.name || "grupo"}
            onChange={v => updL("audiences", v)} />
        </div>

        <div className="card">
          <h2><span className="dot"/>Manifesto</h2>
          <TextField label="kicker" value={lc.manifestoBlock?.kicker} onChange={v => updL("manifestoBlock.kicker", v)} />
          <ArrayOfStrings label="título (uma linha por campo)" value={lc.manifestoBlock?.title} onChange={v => updL("manifestoBlock.title", v)} />
          <TextField label="texto" value={lc.manifestoBlock?.body} type="textarea" onChange={v => updL("manifestoBlock.body", v)} />
        </div>

        <div className="card">
          <h2><span className="dot"/>Depoimentos</h2>
          <TextField label="kicker" value={lc.testimonialsKicker} onChange={v => updL("testimonialsKicker", v)} />
          <ArrayOfObjects label="depoimentos" value={lc.testimonials}
            schema={{ quote: { label: "frase", type: "textarea" }, author: { label: "autor", type: "text" } }}
            renderLabel={item => item.author || "depoimento"}
            onChange={v => updL("testimonials", v)} />
        </div>

        <div className="card">
          <h2><span className="dot"/>FAQ</h2>
          <TextField label="kicker" value={lc.faqKicker} onChange={v => updL("faqKicker", v)} />
          <ArrayOfObjects label="perguntas" value={lc.faq}
            schema={{ q: { label: "pergunta", type: "text" }, a: { label: "resposta", type: "textarea" } }}
            renderLabel={item => item.q || "pergunta"}
            onChange={v => updL("faq", v)} />
        </div>

        <div className="card">
          <h2><span className="dot"/>CTA final</h2>
          <TextField label="kicker" value={lc.finalKicker} onChange={v => updL("finalKicker", v)} />
          <ArrayOfStrings label="título (uma linha por campo)" value={lc.finalTitle} onChange={v => updL("finalTitle", v)} />
          <TextField label="subtítulo" value={lc.finalSub} type="textarea" onChange={v => updL("finalSub", v)} />
        </div>

        <div className="card">
          <h2><span className="dot"/>Rodapé</h2>
          <TextField label="texto do rodapé" value={lc.footer} onChange={v => updL("footer", v)} />
        </div>

      </div>

      {toast && <div className={`toast ${toast.kind}`}>{toast.msg}</div>}
    </>
  );
}

function App() {
  const [pwd, setPwd] = useState(() => localStorage.getItem(PASSWORD_KEY) || null);
  function logout() {
    localStorage.removeItem(PASSWORD_KEY);
    setPwd(null);
  }
  return pwd
    ? <Editor password={pwd} onLogout={logout} />
    : <Login onAuth={setPwd} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
