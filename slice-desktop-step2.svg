<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-grad-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1228"/>
      <stop offset="1" stop-color="#0B0810"/>
    </linearGradient>
    <linearGradient id="album-grad-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8B96"/>
      <stop offset="0.5" stop-color="#E94E9D"/>
      <stop offset="1" stop-color="#A346C2"/>
    </linearGradient>
    <linearGradient id="musicake-pill-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8B96"/>
      <stop offset="0.5" stop-color="#E94E9D"/>
      <stop offset="1" stop-color="#A346C2"/>
    </linearGradient>
    <filter id="glow-2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- bg -->
  <rect width="320" height="200" fill="url(#bg-grad-2)"/>

  <!-- browser chrome -->
  <rect width="320" height="18" fill="#15101F"/>
  <circle cx="8" cy="9" r="2.5" fill="#FF5F57"/>
  <circle cx="16" cy="9" r="2.5" fill="#FEBC2E"/>
  <circle cx="24" cy="9" r="2.5" fill="#28C840"/>
  <rect x="36" y="4" width="240" height="10" rx="5" fill="#2D2240" opacity="0.7"/>
  <text x="44" y="11.5" font-family="JetBrains Mono, monospace" font-size="6" fill="#B2A8C8">spotify.com / track / quase-manha</text>

  <!-- dimmed background (album + meta) -->
  <g opacity="0.32">
    <rect x="20" y="32" width="52" height="52" rx="4" fill="url(#album-grad-2)"/>
    <text x="80" y="46" font-family="JetBrains Mono, monospace" font-size="5" fill="#B2A8C8">TOCANDO AGORA</text>
    <text x="80" y="64" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="13" fill="#F5F1FA">Quase manhã</text>
    <text x="80" y="76" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="8" fill="#B2A8C8">Júlia Bandeira</text>
  </g>

  <!-- backdrop -->
  <rect x="0" y="18" width="320" height="182" fill="#0B0810" opacity="0.55"/>

  <!-- share modal -->
  <g transform="translate(40, 88)">
    <rect x="0" y="0" width="240" height="96" rx="14" fill="#221833" stroke="#3A2D52"/>

    <!-- handle (top center, like a sheet handle) -->
    <rect x="111" y="6" width="18" height="2" rx="1" fill="#4D3B68"/>

    <!-- title -->
    <text x="120" y="24" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" letter-spacing="1.2" fill="#B2A8C8">COMPARTILHAR VIA</text>

    <!-- platform grid (4 apps, horizontal) -->
    <!-- Spotify -->
    <g transform="translate(22, 36)">
      <rect x="0" y="0" width="40" height="46" rx="10" fill="#1A1228"/>
      <circle cx="20" cy="18" r="11" fill="#1DB954"/>
      <text x="20" y="22" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="11" fill="#0B0810">♫</text>
      <text x="20" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="6" fill="#B2A8C8">Spotify</text>
    </g>

    <!-- Musicake (highlighted) -->
    <g transform="translate(72, 36)" filter="url(#glow-2)">
      <rect x="-2" y="-2" width="44" height="50" rx="11" fill="#221833" stroke="url(#musicake-pill-grad)" stroke-width="1.5"/>
      <rect x="9" y="7" width="22" height="22" rx="6" fill="url(#musicake-pill-grad)"/>
      <!-- musicake symbol stylized -->
      <path d="M16 13 L 20 13 L 20 24 L 17 24 L 17 18 L 24 18 L 24 24 L 21 24 L 21 13 L 24 13" fill="#FFFFFF" opacity="0.95" transform="translate(-2, 0) scale(0.85)"/>
      <text x="20" y="42" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="6" fill="#FFFFFF">Musicake</text>
    </g>

    <!-- WhatsApp -->
    <g transform="translate(122, 36)">
      <rect x="0" y="0" width="40" height="46" rx="10" fill="#1A1228"/>
      <circle cx="20" cy="18" r="11" fill="#25D366"/>
      <text x="20" y="22" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="11" fill="#0B0810">w</text>
      <text x="20" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="6" fill="#B2A8C8">WhatsApp</text>
    </g>

    <!-- Messages -->
    <g transform="translate(172, 36)">
      <rect x="0" y="0" width="40" height="46" rx="10" fill="#1A1228"/>
      <circle cx="20" cy="18" r="11" fill="#0084FF"/>
      <text x="20" y="22" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="11" fill="#0B0810">m</text>
      <text x="20" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="6" fill="#B2A8C8">Messages</text>
    </g>
  </g>
</svg>
